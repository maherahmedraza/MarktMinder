# MarktMinder CI/CD Pipeline
# Runs on push to main and pull requests
# Updated for Turborepo monorepo structure with API v1

name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  POSTGRES_USER: marktminder
  POSTGRES_PASSWORD: testpassword
  POSTGRES_DB: marktminder_test
  REDIS_URL: redis://localhost:6379

jobs:
  # ============================================
  # Monorepo Build & Test
  # ============================================
  build-and-test:
    name: Build & Test All Workspaces
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present

      - name: Run type check (Backend)
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Run type check (Frontend)
        run: npx tsc --noEmit
        working-directory: apps/frontend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}

      - name: Build packages
        run: npm run build --workspace=@marktminder/shared --workspace=@marktminder/database

      - name: Build backend
        run: npm run build --workspace=@marktminder/backend

      - name: Build frontend
        run: npm run build --workspace=@marktminder/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

      - name: Run backend tests
        run: npm run test --workspace=@marktminder/backend --if-present
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/backend/dist
            apps/frontend/.next
          retention-days: 7

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  # ============================================
  # Docker Build (on main only)
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/marktminder-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/marktminder-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/marktminder-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/marktminder-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ============================================
  # Notify on Completion
  # ============================================
  notify:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Security: ${{ needs.security.result }}"

      - name: Summary
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            echo "🚀 Ready for deployment"
          else
            echo "❌ CI checks failed"
            exit 1
          fi
